<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Projeto ONG</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>
        <h1>Cadastro</h1>

        <nav>
            <a href="index.html">Início</a>
            <a href="projetos.html">Projetos</a>
            <a href="cadastro.html">Cadastro</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Formulário de Cadastro</h2>

            <form>

                <fieldset>
                    <legend>Dados pessoais</legend>

                    <label for="nome">Nome completo:</label>
                    <input type="text" id="nome" name="nome" required>

                    <br><br>

                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required>

                    <br><br>

                    <label for="nascimento">Data de nascimento:</label>
                    <input type="date" id="nascimento" name="nascimento" required>

                    <br><br>

                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" name="cpf"
                    pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                    placeholder="000.000.000-00" required>

                    <br><br>

                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" name="telefone"
                    pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"
                    placeholder="(16) 99999-9999" required>

                </fieldset>

                <br>

                <fieldset>
                    <legend>Endereço</legend>

                    <label for="endereco">Endereço:</label>
                    <input type="text" id="endereco" name="endereco" required>

                    <br><br>

                    <label for="cidade">Cidade:</label>
                    <input type="text" id="cidade" name="cidade" required>

                    <br><br>

                    <label for="estado">Estado:</label>
                    <select id="estado" name="estado" required>
                        <option value="">Selecione</option>
                        <option value="SP">São Paulo</option>
                        <option value="MG">Minas Gerais</option>
                        <option value="RJ">Rio de Janeiro</option>
                    </select>

                    <br><br>

                    <label for="cep">CEP:</label>
                    <input type="text" id="cep" name="cep"
                    pattern="[0-9]{5}-[0-9]{3}"
                    placeholder="00000-000" required>

                </fieldset>

                <br>

                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required>

                <br><br>

                <button type="submit">Cadastrar</button>

            </form>
        </section>
    </main>

    <footer>
        <p>Projeto acadêmico - Desenvolvimento Front-End</p>
    </footer>
    <div id="modal"
     class="modal"
     role="dialog"
     aria-modal="true"
     aria-labelledby="titulo-modal"
     aria-hidden="true">

    <div class="modal-conteudo">
        <h2 id="titulo-modal">Obrigado pelo seu apoio!</h2>

        <p>
            Sua mensagem foi enviada com sucesso.
            Em breve entraremos em contato.
        </p>

        <button type="button" id="fechar-modal" onclick="fecharModal()">
            Entendi
        </button>
    </div>
</div>
<script src="../js/app.js"></script>
</body>
</html>
